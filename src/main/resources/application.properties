spring.application.name=budgetBook
가server.port=8080


# ========================
# DataSource (MySQL)
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/budgetbook?serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate
# ========================
# create: 서버 시작 시 테이블 자동 생성 (개발 초기에만 사용)
# 주의: create는 기존 테이블을 DROP 후 재생성 → 데이터 초기화됨
# Entity 코드가 안정화되면 validate로 변경할 것

spring.jpa.hibernate.ddl-auto=create
# 실행되는 SQL을 콘솔에 출력 (개발 시 쿼리 확인용)
spring.jpa.show-sql=true
# SQL을 들여쓰기 형식으로 보기 좋게 출력
spring.jpa.properties.hibernate.format_sql=true
# MySQL 방언 설정: Hibernate가 MySQL 문법에 맞는 SQL 생성
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ========================
# JWT
# ========================
# 서명 비밀키: HS256 기준 최소 32자(256비트) 이상 필수
# 운영 환경에서는 반드시 환경변수로 주입 (하드코딩 금지)
jwt.secret=${JWT_SECRET:budgetbook-secret-key-must-be-at-least-256-bits-long!!}

# AccessToken 만료: 15분 (15 * 60 * 1000 = 900,000ms)
jwt.access-expiration=900000

# RefreshToken 만료: 7일 (7 * 24 * 60 * 60 * 1000 = 604,800,000ms)
jwt.refresh-expiration=604800000
