spring.application.name=budgetBook


# ========================
# JWT
# ========================
# 서명 비밀키: HS256 기준 최소 32자(256비트) 이상 필수
# 운영 환경에서는 반드시 환경변수로 주입 (하드코딩 금지)
jwt.secret=${JWT_SECRET:budgetbook-secret-key-must-be-at-least-256-bits-long!!}

# AccessToken 만료: 15분 (15 * 60 * 1000 = 900,000ms)
jwt.access-expiration=900000

# RefreshToken 만료: 7일 (7 * 24 * 60 * 60 * 1000 = 604,800,000ms)
jwt.refresh-expiration=604800000
